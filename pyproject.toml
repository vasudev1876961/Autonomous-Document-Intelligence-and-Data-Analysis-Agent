[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adida-agent"
version = "4.1.0"
description = "Autonomous Document Intelligence & Data Analysis Agent (ADIDA) - Evidence-driven multi-format document understanding, deterministic quantitative analytics, forensic accounting, and audit-grade verified reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vasudev", email = "vasudev@example.com" }
]
keywords = [
    "document-intelligence",
    "data-analysis",
    "forensic-accounting",
    "benfords-law",
    "multi-agent",
    "langgraph",
    "fastapi",
    "audit-reporting",
    "causal-inference",
    "rag"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.33.0",
    "rank-bm25>=0.2.2",
    "pytest>=8.0.0",
    "rich>=13.7.0",
    "reportlab>=4.1.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.20.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
adida = "cli:main"

[project.urls]
Homepage = "https://github.com/vasudev1876961/Autonomous-Document-Intelligence-and-Data-Analysis-Agent"
Repository = "https://github.com/vasudev1876961/Autonomous-Document-Intelligence-and-Data-Analysis-Agent.git"
Documentation = "https://github.com/vasudev1876961/Autonomous-Document-Intelligence-and-Data-Analysis-Agent#readme"
"Bug Tracker" = "https://github.com/vasudev1876961/Autonomous-Document-Intelligence-and-Data-Analysis-Agent/issues"

[tool.setuptools]
py-modules = ["cli", "app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
