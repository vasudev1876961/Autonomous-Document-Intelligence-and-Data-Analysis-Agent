version: '3.8'

services:
  # Container 1: Enterprise FastAPI Microservice with Prometheus Telemetry
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adida-api
    command: python scripts/run_api.py --port 8000 --host 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app/data/processed
      - shared-outputs:/app/outputs
    environment:
      - ADIDA_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - adida-net

  # Container 2: Streamlit Interactive Executive Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adida-dashboard
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - shared-data:/app/data/processed
      - shared-outputs:/app/outputs
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_BASE_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - adida-net

  # Container 3: ChromaDB Vector Store Microservice
  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: adida-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - adida-net

  # Container 4: Redis Caching Layer for Embedding Caching & Session State
  redis:
    image: redis:7.2-alpine
    container_name: adida-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - adida-net

volumes:
  shared-data:
  shared-outputs:
  chroma-data:
  redis-data:

networks:
  adida-net:
    driver: bridge
