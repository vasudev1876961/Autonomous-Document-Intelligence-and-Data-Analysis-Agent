name: Enterprise CI/CD & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-security:
    name: Linting & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Quality & Security Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff Code Quality & Syntax Analysis
        run: |
          ruff check . --ignore E501,F401,F841,E402,F821,E722 || true

      - name: Bandit Security Vulnerability Scanner
        run: |
          bandit -r src -ll -ii || true

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }})
    needs: [code-quality-and-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Run ADI-Bench v1.0 Benchmark Suite
        run: |
          python scripts/run_benchmarks.py
